name: Go Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  # Least-privilege default, as in release.yaml. This workflow only checks
  # out the tree and runs tests, so it never needs to write. That matters
  # more here than elsewhere: it runs on pull_request, so the test code it
  # executes comes from the pull request itself, and a token that can write
  # would be handed to code the repository has not merged yet.
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A plain PostgreSQL server for the unit tests that need a database. They
    # are skipped when their DSN variable is not set. Trust authentication
    # lets a test log in as a role that it creates without a password.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    # Run whole packages, not lists of test names, so a new test runs in CI
    # without a change here, and each test runs once. The integration tests
    # share one cluster for the whole run; each test cleans up after itself.
    - name: Run unit tests
      env:
        ACE_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
        ACE_SLICER_TEST_DSN: postgres://postgres@localhost:5432/postgres?sslmode=disable
      run: go test -count=1 -v $(go list ./... | grep -v /tests/integration)

    - name: Run integration tests
      run: go test -count=1 -v -timeout 90m ./tests/integration

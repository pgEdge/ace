name: Go Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  # Least-privilege default, as in release.yaml. This workflow only checks
  # out the tree and runs tests, so it never needs to write. That matters
  # more here than elsewhere: it runs on pull_request, so the test code it
  # executes comes from the pull request itself, and a token that can write
  # would be handed to code the repository has not merged yet.
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        lfs: true

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    # Run whole packages, not lists of test names, so a new test runs in CI
    # without a change here, and each test runs once. The integration tests
    # share one cluster for the whole run; each test cleans up after itself.
    - name: Run unit tests
      run: go test -count=1 -v $(go list ./... | grep -v /tests/integration)

    - name: Run integration tests
      run: go test -count=1 -v -timeout 90m ./tests/integration
